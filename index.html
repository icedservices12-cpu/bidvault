<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Bid Vault</title>
<style>
html,body{margin:0;min-height:100%;background:#0c1729;color:#e8eef6;font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px 16px;box-sizing:border-box}
.card{max-width:400px;background:#12223b;border:1px solid #243a5c;border-radius:18px;padding:26px 22px;text-align:center}
img{width:72px;height:72px;border-radius:17px}
h1{font-size:22px;margin:10px 0 6px}
p{color:#91a5bf;margin:8px 0}
</style>
</head>
<body>
<main class="card">
  <img src="apple-touch-icon.png" alt="">
  <h1>Bid Vault has moved</h1>
  <p>This old version is switched off. Ask the owner for your new Bid Vault link, open it in Safari, and add it to your Home Screen.</p>
  <p>If you added this old version to your Home Screen, you can delete that icon.</p>
</main>
<script>
// clear out the old offline copy, if this phone had one
if ("serviceWorker" in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
if (window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k))).catch(() => {});
try { indexedDB.deleteDatabase("bidvault-access"); } catch (_) {}
</script>
</body>
</html>
